<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" height="170">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Left Card: Portfolio Telemetry -->
  <g transform="translate(0, 0)">
    <rect width="588" height="170" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <text x="24" y="34" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">ENGINEERING PORTFOLIO TELEMETRY</text>

    <g transform="translate(24, 56)">
      <rect width="124" height="88" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
      <text x="62" y="42" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">50</text>
      <text x="62" y="68" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">ACTIVE REPOS</text>
    </g>

    <g transform="translate(162, 56)">
      <rect width="124" height="88" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
      <text x="62" y="42" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">44</text>
      <text x="62" y="68" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">ORIGINAL STACKS</text>
    </g>

    <g transform="translate(300, 56)">
      <rect width="124" height="88" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
      <text x="62" y="42" text-anchor="middle" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">7</text>
      <text x="62" y="68" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">STAR LISTS</text>
    </g>

    <g transform="translate(438, 56)">
      <rect width="126" height="88" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
      <text x="63" y="42" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">7</text>
      <text x="63" y="68" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">DOCS PORTALS</text>
    </g>
