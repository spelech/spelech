  <!-- Right Card: Language Distribution -->
  <g transform="translate(612, 0)">
    <rect width="588" height="170" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <text x="24" y="34" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">PRIMARY LANGUAGE DISTRIBUTION</text>

    <!-- Multi-segment Progress Bar -->
    <g transform="translate(24, 54)">
      <rect x="0" y="0" width="230" height="14" rx="4" fill="#3572A5" />
      <rect x="234" y="0" width="165" height="14" rx="4" fill="#3178C6" />
      <rect x="403" y="0" width="102" height="14" rx="4" fill="#178600" />
      <rect x="509" y="0" width="31" height="14" rx="4" fill="#F34B7D" />
    </g>

    <!-- Legend -->
    <g transform="translate(24, 92)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
      <circle cx="8" cy="6" r="6" fill="#3572A5" />
      <text x="22" y="10" fill="#E2E8F0" font-weight="600">Python</text>
      <text x="76" y="10" fill="#64748B">41% (19 repos)</text>

      <circle cx="290" cy="6" r="6" fill="#3178C6" />
      <text x="304" y="10" fill="#E2E8F0" font-weight="600">TypeScript</text>
      <text x="386" y="10" fill="#64748B">30% (14 repos)</text>

      <circle cx="8" cy="36" r="6" fill="#178600" />
      <text x="22" y="40" fill="#E2E8F0" font-weight="600">C# / .NET 10</text>
      <text x="116" y="40" fill="#64748B">18% (8 repos)</text>

      <circle cx="290" cy="36" r="6" fill="#F34B7D" />
      <text x="304" y="40" fill="#E2E8F0" font-weight="600">C++ / OpenXR / Other</text>
      <text x="458" y="40" fill="#64748B">11%</text>
