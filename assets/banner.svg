<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.65" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="260" rx="16" fill="url(#grid)" />
  <rect width="1200" height="140" rx="16" fill="url(#glowGrad)" />

  <!-- Top Accent Line -->
  <rect x="2" y="2" width="1196" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Decorative Right Telemetry Nodes -->
  <g opacity="0.85" transform="translate(830, 38)">
    <rect x="0" y="0" width="330" height="184" rx="10" fill="#0B1324" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" />
    <circle cx="36" cy="20" r="5" fill="#F59E0B" />
    <circle cx="52" cy="20" r="5" fill="#10B981" />
    <text x="72" y="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">mcp-gateway://telemetry.stream</text>
    <line x1="0" y1="36" x2="330" y2="36" stroke="#1E293B" stroke-width="1" />

    <text x="18" y="62" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">$ agy status --cluster=homelab</text>
    <text x="18" y="86" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">[OK] Model Context Gateway   v5.24.1</text>
    <text x="18" y="106" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">[OK] ContextCortex AST/RAG   v2.20.0</text>
    <text x="18" y="126" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">[OK] LocalLLMServerManager   v4.1.0</text>
    <text x="18" y="146" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">[OK] CLIAgentDispatch        v0.6.0</text>
    <text x="18" y="168" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">● 50 Active Repos | 7 Domain Clusters</text>
  </g>

  <!-- Main Typography -->
  <text x="48" y="64" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.5">SYSTEMS ARCHITECTURE &amp; AUTONOMOUS ENGINEERING</text>
  <text x="48" y="116" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">Steven Pelech</text>
  <text x="345" y="116" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="500">@spelech</text>

  <text x="48" y="154" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Lead Software Engineer &amp; Systems Architect</text>

  <!-- Domain Pills -->
  <g transform="translate(48, 182)">
    <rect x="0" y="0" width="168" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <text x="84" y="21" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">MCP Infrastructure</text>

    <rect x="180" y="0" width="176" height="32" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
    <text x="268" y="21" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">Local LLM &amp; GPU</text>

    <rect x="368" y="0" width="172" height="32" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1" stroke-opacity="0.5" />
    <text x="454" y="21" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">Smart Home &amp; IoT</text>

    <rect x="552" y="0" width="182" height="32" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5" />
    <text x="643" y="21" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">Sim Telemetry &amp; VR</text>
  </g>
</svg>
